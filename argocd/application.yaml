apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/devops-tech-challenge-2.git
    targetRevision: gitops
    path: helm/hello-world
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
